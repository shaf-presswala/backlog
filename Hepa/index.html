<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEPA bag backlog</title>
<style>
:root{color-scheme:light}
/* Without this the input and button, both width:100%, add their padding and border
   ON TOP of the card's width and spill ~26px past its right edge (Shaf, 30 Sep 2026). */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FCF7E9;
  padding:24px;
  color:#33312B;font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:min(92vw,380px);background:#FFFDF6;border:1px solid #E4DCC5;border-radius:10px;
  padding:28px 26px;box-shadow:0 10px 30px #33312B14}
h1{margin:0 0 4px;font-size:17px;font-weight:600}
p{margin:0 0 18px;color:#6B6559;font-size:13px}
label{display:block;font-size:12px;color:#6B6559;margin-bottom:6px}
input{width:100%;padding:10px 12px;font-size:14px;border:1px solid #E4DCC5;border-radius:6px;
  background:#FCF7E9;color:#33312B;font-family:inherit}
input:focus{outline:2px solid #A79B80;outline-offset:1px;border-color:#A79B80}
button{margin-top:12px;width:100%;padding:10px;font-size:14px;font-weight:600;
  border:0;border-radius:6px;background:#33312B;color:#FCF7E9;cursor:pointer;
  font-family:inherit}
button:hover{background:#44413A}
button[disabled]{opacity:.55;cursor:default}
.err{margin-top:11px;color:#C4574F;font-size:12.5px;min-height:1.2em}
</style></head><body>

var SKEY = "maticBacklogPw";

// Appended to the decrypted page so a board left open stays current. Reloading
// re-enters this gate, which auto-unlocks from sessionStorage -- so the refresh is
// invisible, no password re-entry.
//
// It defers while someone is USING the page: a reload resets the filters, the sort
// and the scroll position, and yanking that away mid-investigation is worse than a
// slightly stale number. Idle for a minute and it goes; otherwise it waits.
var AUTORELOAD = '<script>(function(){' +
  'var EVERY=600000, IDLE=60000, last=Date.now();' +
  '["mousemove","keydown","click","scroll","touchstart","change"].forEach(' +
    'function(e){window.addEventListener(e,function(){last=Date.now();},' +
    '{passive:true,capture:true});});' +
  'setInterval(function(){' +
    'if(document.hidden||Date.now()-last<IDLE) return;' +
    // GitHub Pages serves cache-control: max-age=600, so a plain reload can be
    // answered from cache and show the SAME numbers. A changing query string
    // forces a trip to the server (Shaf, 1 Oct 2026).
    'location.replace(location.pathname+"?t="+Date.now());' +
  '},EVERY);' +
  '})();<\/script>';
var b64 = function(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};

async function unlock(password){
  var pw=new TextEncoder().encode(password);
  var base=await crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(DATA.s),iterations:DATA.n,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.i)},key,b64(DATA.c));
  // replace the whole document with the decrypted page, plus the self-refresh. The
  // snippet is appended to the DECRYPTED html rather than run from here, because
  // document.write() tears down this document and anything it had registered.
  var doc=new TextDecoder().decode(out)+AUTORELOAD;
  document.open(); document.write(doc); document.close();
}

// Remember the password for this TAB, so a reload does not re-prompt -- the page is
// republished every 10 minutes and retyping it each time made it unusable (Shaf,
// 30 Sep 2026). sessionStorage, not localStorage: it is dropped when the tab closes,
// never written to disk, and never leaves the browser. Wrapped because Safari in
// private mode throws on access rather than returning null.
function remembered(){
  try{ return sessionStorage.getItem(SKEY); }catch(e){ return null; }
}
function remember(v){
  try{ sessionStorage.setItem(SKEY,v); }catch(e){}
}
function forget(){
  try{ sessionStorage.removeItem(SKEY); }catch(e){}
}

document.getElementById("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var err=document.getElementById("e"), go=document.getElementById("go");
  err.textContent=""; go.disabled=true; go.textContent="Opening…";
  var v=document.getElementById("p").value;
  try{
    await unlock(v);
    remember(v);
  }catch(e){
    // a wrong key fails the GCM tag check, which is the only signal we get
    err.textContent="That password did not work.";
    go.disabled=false; go.textContent="Open";
    document.getElementById("p").select();
  }
});

// Auto-open if this tab has already been unlocked once.
(async function(){
  var saved=remembered();
  if(!saved) return;
  var box=document.getElementById("box");
  box.style.visibility="hidden";          // avoid a flash of the password form
  try{
    await unlock(saved);
  }catch(e){
    // stale password -- most likely it was rotated since this tab last opened
    forget();
    box.style.visibility="visible";
    document.getElementById("e").textContent="Password changed. Please enter it again.";
  }
})();
</script>
